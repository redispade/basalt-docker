services:
  basalt:
    build:
      context: .
      args:
        BASALT_REF: ${BASALT_REF:-main}
        BUILD_JOBS: ${BUILD_JOBS:-16}
        APP_UID: ${LOCAL_UID:-1000}
        APP_GID: ${LOCAL_GID:-1000}
    gpus: all
    init: true
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - "11440:8080"
    command:
      - --api-key
      - "${BASALT_API_KEY:?Set BASALT_API_KEY in .env}"
    volumes:
      - ./basalt_config.json:/config/basalt_config.json:ro
      - ${MODELS_VOLUME:-./models}:/models:ro
      - ./cache:/home/basalt/.cache
